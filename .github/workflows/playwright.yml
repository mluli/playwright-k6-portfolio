name: CI/CD Pipeline - API, E2E & Performance Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-performance:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Instalar dependencias
      run: npm ci

    - name: Instalar navegadores de Playwright
      run: npx playwright install --with-deps

    - name: Ejecutar pruebas de API y E2E
      run: npx playwright test

    - name: Guardar reporte de Playwright
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Instalar k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D661C469
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Ejecutar pruebas de rendimiento con k6
      run: k6 run tests/performance/load-test.js --out json=k6-results.json

    - name: Guardar reporte de k6
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: k6-performance-report
        path: k6-results.json
        retention-days: 30

        
    - name: Iniciar API propia
      run: npm run start:api &

    - name: Esperar a que la API este lista
      run: npx wait-on http://localhost:3000/users

    - name: Ejecutar pruebas de Playwright
      run: npx playwright test
env:
  REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
    